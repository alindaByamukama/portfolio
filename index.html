<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alinda Byamukama</title>
  <meta name="description" content="Pick whichever of these makes sense for why you came.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:url" content="https://alindabyamukama.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alinda Byamukama">
  <meta property="og:description" content="Pick whichever of these makes sense for why you came.">
  <meta property="og:image" content="https://alindabyamukama.com/profile-pic-ng-faceforward.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Alinda Byamukama">
  <meta name="twitter:description" content="Pick whichever of these makes sense for why you came.">
  <meta name="twitter:image" content="https://alindabyamukama.com/profile-pic-ng-faceforward.png">
  <link rel="shortcut icon" type="image/png" href="assets/avatar.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --sky: #7CBCDD;
      --sky-deep: #7EC8E8;
      --cream: #FFF6ED;
      --panel: #BEB0EC;
      --bubblegum: #FF8FBE;
      --butter: #FFDD57;
      --mint: #86E3D0;
      --lilac: #BBA6F5;
      --ink: #2B2A4C;
      --grid: rgba(255, 255, 255, 0.62);

      --display: "Rammetto One", Impact, sans-serif;
      --pixel: "Silkscreen", ui-monospace, monospace;
      --body: "Nunito", system-ui, sans-serif;

      --edge: 3px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--sky);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 44px 44px;
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 5vw, 3.5rem) 1rem;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 700px;
    }

    /* ---------- floating stickers ---------- */

    .sticker {
      position: absolute;
      width: 62px;
      height: 62px;
      filter: drop-shadow(3px 4px 0 rgba(43, 42, 76, 0.25));
      pointer-events: none;
      z-index: 3;
    }

    .sticker svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sticker--a {
      top: -34px;
      left: -52px;
    }

    .sticker--b {
      top: 24%;
      right: -60px;
      width: 54px;
      height: 54px;
    }

    .sticker--c {
      bottom: 16%;
      left: -58px;
      width: 50px;
      height: 50px;
    }

    .sticker--d {
      bottom: -30px;
      right: -40px;
      width: 72px;
      height: 72px;
    }

    @media (max-width: 900px) {
      .sticker {
        display: none;
      }
    }

    /* ---------- window ---------- */

    .window {
      position: relative;
      z-index: 2;
      background: var(--panel);
      border: var(--edge) solid var(--ink);
      border-radius: 10px;
      box-shadow: 8px 8px 0 var(--ink);
    }

    .titlebar {
      border-radius: 7px 7px 0 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.7rem;
      background: linear-gradient(90deg, var(--bubblegum), var(--lilac));
      border-bottom: var(--edge) solid var(--ink);
    }

    .titlebar__name {
      font-family: var(--pixel);
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      text-shadow: 1px 1px 0 var(--ink);
      flex: 1 1 auto;
      letter-spacing: 0.02em;
    }

    .titlebar__buttons {
      display: flex;
      gap: 0.35rem;
    }

    .titlebar__btn {
      width: 20px;
      height: 18px;
      display: grid;
      place-items: center;
      background: var(--cream);
      border: 2px solid var(--ink);
      border-radius: 3px;
      font-family: var(--pixel);
      font-size: 0.6rem;
      line-height: 1;
    }

    .window__body {
      display: flex;
    }

    .content {
      flex: 1 1 auto;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      padding-bottom: calc(clamp(1.5rem, 5vw, 2.5rem) + 8px);
      min-width: 0;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    /* decorative scrollbar, purely for the look */
    .fakescroll {
      flex: 0 0 26px;
      border-left: var(--edge) solid var(--ink);
      background: #D6CBF2;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      font-family: var(--pixel);
      font-size: 0.6rem;
    }

    .fakescroll span {
      height: 24px;
      display: grid;
      place-items: center;
      background: var(--cream);
      border-bottom: 2px solid var(--ink);
    }

    .fakescroll span:last-child {
      border-bottom: 0;
      border-top: 2px solid var(--ink);
      margin-top: auto;
    }

    .fakescroll i {
      display: block;
      height: 70px;
      margin: 4px;
      background: var(--lilac);
      border: 2px solid var(--ink);
      border-radius: 3px;
    }

    @media (max-width: 560px) {
      .fakescroll {
        display: none;
      }
    }

    /* ---------- avatar sticker ---------- */

    .avatar {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 0 1.5rem;
      transform: rotate(-4deg);
    }

    .avatar__disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--butter);
      border: var(--edge) solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
    }

    .avatar__img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* ---------- type ---------- */

    .tab {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      background: var(--mint);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      box-shadow: 3px 3px 0 var(--ink);
      margin: 0 0 1.1rem;
    }

    .greeting {
      font-family: var(--display);
      font-size: clamp(1.45rem, 5.2vw, 2.7rem);
      line-height: 1.18;
      overflow-wrap: break-word;
      margin: 0 0 1.1rem;
      color: var(--cream);
      text-shadow:
        3px 3px 0 var(--bubblegum),
        5px 5px 0 var(--ink);
      text-wrap: balance;
    }

    .greeting em {
      font-style: normal;
      display: block;
      font-size: 0.68em;
      text-shadow:
        3px 3px 0 var(--sky-deep),
        5px 5px 0 var(--ink);
    }

    .note {
      max-width: 46ch;
      font-weight: 600;
      color: rgba(43, 42, 76, 0.92);
      margin: 0 0 1.75rem;
    }

    .links-label {
      font-family: var(--pixel);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin: 0 0 0.85rem;
    }

    .links-label::before {
      content: "★ ";
    }

    /* ---------- link buttons ---------- */

    .links {
      list-style: none;
      margin: 0 6px 6px 0;
      padding: 0;
      display: grid;
      gap: 1.1rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1.1rem;
      background: var(--chip);
      color: var(--ink);
      text-decoration: none;
      border: var(--edge) solid var(--ink);
      border-radius: 14px;
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .link:active {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--ink);
    }

    .link:focus-visible {
      outline: 3px dashed var(--ink);
      outline-offset: 4px;
    }

    .link__name {
      font-family: var(--display);
      font-size: 1rem;
      flex: 0 0 auto;
    }

    .link__detail {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(43, 42, 76, 0.72);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link__arrow {
      font-family: var(--pixel);
      font-size: 0.95rem;
      flex: 0 0 auto;
    }

    /* ---------- status bar ---------- */

    .statusbar {
      border-radius: 0 0 7px 7px;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0.8rem;
      background: #D6CBF2;
      border-top: var(--edge) solid var(--ink);
      font-family: var(--pixel);
      font-size: 0.68rem;
    }

    @media (max-width: 480px) {
      .link {
        flex-wrap: wrap;
        row-gap: 0.1rem;
      }

      .link__detail {
        flex-basis: 100%;
        order: 3;
        white-space: normal;
      }

      .link__arrow {
        margin-left: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="stage">

    <!-- stickers -->
    <div class="sticker sticker--a" aria-hidden="true"><svg viewBox="0 0 100 100">
        <path d="M50 4 L60 40 L96 50 L60 60 L50 96 L40 60 L4 50 L40 40 Z" fill="#FFDD57" stroke="#2B2A4C"
          stroke-width="5" stroke-linejoin="round" />
      </svg></div>
    <div class="sticker sticker--b" aria-hidden="true"><svg viewBox="0 0 100 100">
        <g stroke="#2B2A4C" stroke-width="5">
          <circle cx="50" cy="22" r="18" fill="#FF8FBE" />
          <circle cx="78" cy="50" r="18" fill="#FF8FBE" />
          <circle cx="50" cy="78" r="18" fill="#FF8FBE" />
          <circle cx="22" cy="50" r="18" fill="#FF8FBE" />
          <circle cx="50" cy="50" r="13" fill="#FFF6ED" />
        </g>
      </svg></div>
    <div class="sticker sticker--c" aria-hidden="true"><svg viewBox="0 0 100 100">
        <path d="M58 4 L26 54 H48 L42 96 L76 44 H52 Z" fill="#BBA6F5" stroke="#2B2A4C" stroke-width="5"
          stroke-linejoin="round" />
      </svg></div>
    <div class="sticker sticker--d" aria-hidden="true"><svg viewBox="0 0 100 100">
        <g stroke="#2B2A4C" stroke-width="5">
          <circle cx="50" cy="50" r="42" fill="#86E3D0" />
          <circle cx="36" cy="42" r="5" fill="#2B2A4C" stroke="none" />
          <circle cx="64" cy="42" r="5" fill="#2B2A4C" stroke="none" />
          <path d="M32 62 Q50 80 68 62" fill="none" stroke-linecap="round" />
        </g>
      </svg></div>

    <div class="window" id="window">

      <div class="titlebar">
        <span class="titlebar__name">♥ alinda_byamukama.exe</span>
        <span class="titlebar__buttons" aria-hidden="true">
          <span class="titlebar__btn">_</span>
          <span class="titlebar__btn">□</span>
          <span class="titlebar__btn">x</span>
        </span>
      </div>

      <div class="window__body">
        <div class="content">

          <!-- ══════════════════════════════════════════════════════════
             EDIT EVERYTHING BELOW THIS LINE.
             ══════════════════════════════════════════════════════════ -->

          <div class="avatar" id="avatar">
            <div class="avatar__disc" id="disc"></div>
            <!-- point this at your own photo. Square crop works best; it gets clipped to a circle. -->
            <img class="avatar__img" id="avatarImg" alt="Alinda Byamukama" src="assets/avatar.png">
          </div>

          <p class="tab">KAMPALA, UGANDA</p>

          <h1 class="greeting">Hi there,<em>nice of you to stop by.</em></h1>

          <p class="note">
            Pick whichever of these makes sense for
            why you came.
          </p>

          <p class="links-label">FIND ME AT</p>

          <ul class="links" id="links"></ul>

        </div>

        <div class="fakescroll" aria-hidden="true">
          <span>▲</span>
          <i></i>
          <span>▼</span>
        </div>
      </div>

      <div class="statusbar">
        <span>© <span id="year"></span> ALINDA BYAMUKAMA</span>
        <span>READY ♥</span>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    /* ────────────────────────────────────────────────────────────────
       ADD A LINK: copy one block, change the three fields, done.
       Order here is the order on the page. Delete a block to remove it.
       Button colours cycle automatically — you never have to pick one.
       ──────────────────────────────────────────────────────────────── */

    const LINKS = [
      {
        name: "LinkedIn",
        detail: "work history and the professional face",
        url: "https://ug.linkedin.com/in/alindabyamukama"
      },
      {
        name: "GitHub",
        detail: "notebooks, datasets, and works in progress",
        url: "https://github.com/alindaByamukama"
      },
      {
        name: "Writing",
        detail: "posts about learning in public",
        url: "https://alindabyamukama.hashnode.dev/"
      },
      {
        name: "Instagram",
        detail: "the off-duty version",
        url: "https://www.instagram.com/alindasusanpearl/"
      },
      {
        name: "Bluesky",
        detail: "shorter thoughts, sporadic posts, and a few memes",
        url: "https://bsky.app/profile/alindabyamukama.bsky.social"
      },
      {
        name: "Email",
        detail: "alindabyamukama@gmail.com — I reply occasionally",
        url: "mailto:alindabyamukama@gmail.com"
      }
    ];

    /* ── nothing below needs editing ── */

    const CHIPS = ["--bubblegum", "--butter", "--mint", "--lilac", "--sky-deep"];

    const list = document.getElementById("links");

    LINKS.forEach((link, i) => {
      const item = document.createElement("li");
      const anchor = document.createElement("a");

      anchor.className = "link";
      anchor.href = link.url;
      anchor.rel = "me noopener";
      if (!link.url.startsWith("mailto:")) anchor.target = "_blank";
      anchor.style.setProperty("--chip", `var(${CHIPS[i % CHIPS.length]})`);

      const name = document.createElement("span");
      name.className = "link__name";
      name.textContent = link.name;

      const detail = document.createElement("span");
      detail.className = "link__detail";
      detail.textContent = link.detail;

      const arrow = document.createElement("span");
      arrow.className = "link__arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "▸";

      anchor.append(name, detail, arrow);
      item.append(anchor);
      list.append(item);
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---------- motion ---------- */

    const stillPlease = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (window.gsap && !stillPlease) {
      const avatar = document.getElementById("avatar");
      const img = document.getElementById("avatarImg");

      // the window boots up, then everything inside arrives
      gsap.timeline({ defaults: { ease: "power3.out" } })
        .from("#window", { scale: 0.92, opacity: 0, duration: 0.5, ease: "back.out(1.5)" })
        .from(avatar, { scale: 0.5, rotation: -30, opacity: 0, duration: 0.6, ease: "back.out(2)" }, "-=0.15")
        .from(".tab", { x: -18, opacity: 0, duration: 0.4 }, "-=0.3")
        .from(".greeting", { y: 20, opacity: 0, duration: 0.5 }, "-=0.25")
        .from(".note", { y: 16, opacity: 0, duration: 0.4 }, "-=0.3")
        .from(".links-label", { x: -14, opacity: 0, duration: 0.35 }, "-=0.25")
        .from(".link", { y: 24, opacity: 0, duration: 0.45, stagger: 0.1 }, "-=0.15")
        .from(".sticker", {
          scale: 0, rotation: -60, opacity: 0, duration: 0.5,
          stagger: 0.08, ease: "back.out(2.5)"
        }, "-=0.5");

      // stickers drift, each on its own clock so they never sync up
      gsap.utils.toArray(".sticker").forEach((s, i) => {
        gsap.to(s, {
          y: "+=14", rotation: i % 2 ? 10 : -10,
          duration: 2.4 + i * 0.45,
          ease: "sine.inOut", repeat: -1, yoyo: true
        });
      });

      // poke the photo and it wobbles
      const wobble = gsap.timeline({ paused: true })
        .to(img, { scale: 1.1, rotation: -10, duration: 0.16, ease: "power2.out" })
        .to(img, { rotation: 8, duration: 0.14 })
        .to(img, { rotation: -5, duration: 0.12 })
        .to(img, { rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.35)" });

      avatar.addEventListener("mouseenter", () => wobble.restart());
      avatar.addEventListener("mouseleave", () => gsap.to(img, { scale: 1, duration: 0.3 }));
    }
  </script>

</body>

</html>
